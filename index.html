<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exam Countdown Timer</title>
  <style>
    :root { --bg1:#0f172a; --bg2:#1e293b; --card:#111827cc; --text:#e5e7eb; --muted:#94a3b8; --accent:#22c55e; --accent2:#38bdf8; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: Arial, Helvetica, sans-serif;
      background: radial-gradient(circle at top, #1d4ed8 0%, var(--bg1) 35%, #020617 100%);
      color: var(--text);
      padding: 24px;
    }
    .card {
      width: min(900px, 100%);
      background: var(--card);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
      backdrop-filter: blur(10px);
    }
    h1 { margin: 0 0 10px; font-size: clamp(2rem, 4vw, 3.5rem); }
    p { margin: 0 0 24px; color: var(--muted); line-height: 1.6; }
    .exam-date {
      display: inline-block; margin-bottom: 20px; padding: 10px 16px; border-radius: 999px;
      background: rgba(56,189,248,.12); color: #bae6fd; border: 1px solid rgba(56,189,248,.25);
      font-weight: 700;
    }
    .grid {
      display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 14px;
    }
    .box {
      background: rgba(15,23,42,.75);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 18px;
      padding: 22px 10px;
      text-align: center;
    }
    .num { font-size: clamp(2rem, 5vw, 3.5rem); font-weight: 800; color: var(--accent); }
    .label { margin-top: 8px; font-size: .95rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
    .message { margin-top: 22px; font-size: 1.05rem; color: #dbeafe; }
    .progress-wrap { margin-top: 24px; background: rgba(255,255,255,.08); border-radius: 999px; overflow: hidden; height: 14px; }
    .progress { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width .5s ease; }
    .footer { margin-top: 16px; color: var(--muted); font-size: .92rem; }
    @media (max-width: 700px) { .grid { grid-template-columns: repeat(2, minmax(0,1fr)); } .card { padding: 22px; } }
    @media (max-width: 420px) { .grid { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>
  <main class="card">
    <div class="exam-date">Exam Date: 2 August 2026, 09:00 AM</div>
    <h1>Exam Countdown Timer</h1>
    <p>Stay focused and track the remaining time until your exam. Keep revising a little every day and use this timer as a reminder.</p>

    <section class="grid" aria-label="Countdown timer">
      <div class="box"><div class="num" id="days">0</div><div class="label">Days</div></div>
      <div class="box"><div class="num" id="hours">0</div><div class="label">Hours</div></div>
      <div class="box"><div class="num" id="minutes">0</div><div class="label">Minutes</div></div>
      <div class="box"><div class="num" id="seconds">0</div><div class="label">Seconds</div></div>
    </section>

    <div class="progress-wrap" aria-hidden="true"><div class="progress" id="progress"></div></div>
    <div class="message" id="message">Counting down to your exam...</div>
    <div class="footer" id="today"></div>
  </main>

  <script>
    const examDate = new Date('2026-08-02T09:00:00');
    const startDate = new Date('2026-07-10T00:00:00');
    const daysEl = document.getElementById('days');
    const hoursEl = document.getElementById('hours');
    const minutesEl = document.getElementById('minutes');
    const secondsEl = document.getElementById('seconds');
    const messageEl = document.getElementById('message');
    const progressEl = document.getElementById('progress');
    const todayEl = document.getElementById('today');

    function updateTimer() {
      const now = new Date();
      const diff = examDate - now;
      if (diff <= 0) {
        daysEl.textContent = hoursEl.textContent = minutesEl.textContent = secondsEl.textContent = '0';
        messageEl.textContent = 'Your exam day has arrived. Good luck!';
        progressEl.style.width = '100%';
        return;
      }
      const totalSeconds = Math.floor(diff / 1000);
      const days = Math.floor(totalSeconds / 86400);
      const hours = Math.floor((totalSeconds % 86400) / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      daysEl.textContent = days;
      hoursEl.textContent = hours;
      minutesEl.textContent = minutes;
      secondsEl.textContent = seconds;

      const totalRange = examDate - startDate;
      const elapsed = Math.max(0, now - startDate);
      const progress = Math.min(100, Math.max(0, (elapsed / totalRange) * 100));
      progressEl.style.width = progress.toFixed(2) + '%';
      messageEl.textContent = `Time left: ${days} days, ${hours} hours, ${minutes} minutes, ${seconds} seconds.`;
      todayEl.textContent = 'Today: ' + now.toLocaleString();
    }

    updateTimer();
    setInterval(updateTimer, 1000);
  </script>
</body>
</html>
