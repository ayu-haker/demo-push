<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbital Emoji Clock</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(circle at center, #1a0b2e 0%, #05010f 100%);
            font-family: 'Share Tech Mono', monospace;
            overflow: hidden;
            color: #fff;
        }

        /* Outer Glow Ring */
        .clock-system {
            position: relative;
            width: 400px;
            height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            box-shadow: 0 0 50px rgba(138, 43, 226, 0.2), 
                        inset 0 0 50px rgba(0, 255, 255, 0.1);
            background: repeating-conic-gradient(
                from 0deg,
                transparent 0deg,
                transparent 10deg,
                rgba(255, 255, 255, 0.03) 10deg,
                rgba(255, 255, 255, 0.03) 20deg
            );
        }

        /* Digital Display Center */
        .digital-core {
            position: absolute;
            font-size: 2.5rem;
            font-weight: bold;
            color: #0ff;
            text-shadow: 0 0 10px #0ff, 0 0 20px #0ff, 0 0 40px #0ff;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px 25px;
            border-radius: 10px;
            border: 1px solid rgba(0, 255, 255, 0.3);
            z-index: 10;
            box-shadow: inset 0 0 15px rgba(0, 255, 255, 0.2);
            letter-spacing: 2px;
        }

        /* Orbit Rings */
        .orbit {
            position: absolute;
            top: 50%;
            left: 50%;
            border-radius: 50%;
            /* Translate centers the ring, Rotate will be applied via JS */
            transform-origin: center center;
        }

        .hour-orbit {
            width: 180px;
            height: 180px;
            border: 2px dashed rgba(255, 0, 255, 0.4);
            z-index: 7;
        }

        .minute-orbit {
            width: 260px;
            height: 260px;
            border: 2px dashed rgba(0, 255, 255, 0.4);
            z-index: 6;
        }

        .second-orbit {
            width: 340px;
            height: 340px;
            border: 2px dotted rgba(0, 255, 128, 0.4);
            z-index: 5;
        }

        /* Emoji Satellites */
        .satellite {
            position: absolute;
            top: -15px; /* Positions the emoji exactly on the orbital line */
            left: 50%;
            margin-left: -15px;
            width: 30px;
            height: 30px;
            font-size: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.8));
        }

    </style>
</head>
<body>

    <div class="clock-system">
        
        <!-- Center Digital Clock -->
        <div class="digital-core" id="digital-time">00:00:00</div>

        <!-- Hour Orbit & Satellite -->
        <div class="orbit hour-orbit" id="h-orbit">
            <div class="satellite" id="h-emoji">🕛</div>
        </div>

        <!-- Minute Orbit & Satellite -->
        <div class="orbit minute-orbit" id="m-orbit">
            <div class="satellite" id="m-emoji">🌍</div>
        </div>

        <!-- Second Orbit & Satellite -->
        <div class="orbit second-orbit" id="s-orbit">
            <div class="satellite" id="s-emoji">🛸</div>
        </div>

    </div>

    <script>
        // A unique emoji for every single hour of the 24-hour day
        const hourlyEmojis = [
            "🦇", // 00:00 - Midnight
            "👻", // 01:00
            "🦉", // 02:00
            "💤", // 03:00
            "🌌", // 04:00
            "🌅", // 05:00 - Dawn
            "🥐", // 06:00 - Early Breakfast
            "☕", // 07:00 - Coffee time
            "🚌", // 08:00 - Commute
            "💼", // 09:00 - Work start
            "💻", // 10:00 - Deep work
            "🧠", // 11:00 - Thinking/Meetings
            "🥗", // 12:00 - Noon/Lunch
            "🚶", // 13:00 - Walk
            "⚡", // 14:00 - Energy kick
            "📊", // 15:00 - Analytics/Reports
            "🏃", // 16:00 - Exercise
            "🌇", // 17:00 - Sunset/Heading home
            "🍽️", // 18:00 - Dinner
            "📺", // 19:00 - TV/Chill
            "🍿", // 20:00 - Movie time
            "🎮", // 21:00 - Gaming
            "📖", // 22:00 - Reading
            "🛏️"  // 23:00 - Bedtime
        ];

        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();
            let ms = now.getMilliseconds();

            // Smooth continuous rotation (adding milliseconds)
            const secDeg = ((seconds + ms / 1000) / 60) * 360;
            const minDeg = ((minutes + seconds / 60) / 60) * 360;
            const hourDeg = (((hours % 12) + minutes / 60) / 12) * 360;

            // 1. Rotate the Orbit Rings (Requires centering translate as well)
            document.getElementById('s-orbit').style.transform = `translate(-50%, -50%) rotate(${secDeg}deg)`;
            document.getElementById('m-orbit').style.transform = `translate(-50%, -50%) rotate(${minDeg}deg)`;
            document.getElementById('h-orbit').style.transform = `translate(-50%, -50%) rotate(${hourDeg}deg)`;

            // 2. Counter-rotate the Emojis so they stay upright
            document.getElementById('s-emoji').style.transform = `rotate(${-secDeg}deg)`;
            document.getElementById('m-emoji').style.transform = `rotate(${-minDeg}deg)`;
            document.getElementById('h-emoji').style.transform = `rotate(${-hourDeg}deg)`;

            // 3. Update Digital Time
            const digitalHrs = String(hours).padStart(2, '0');
            const digitalMin = String(minutes).padStart(2, '0');
            const digitalSec = String(seconds).padStart(2, '0');
            document.getElementById('digital-time').innerText = `${digitalHrs}:${digitalMin}:${digitalSec}`;

            // 4. Update the Hour Emoji based on the 24-hour cycle
            document.getElementById('h-emoji').innerText = hourlyEmojis[hours];
        }

        // Run smoothly using requestAnimationFrame for 60fps silky smooth rotation
        function animate() {
            updateClock();
            requestAnimationFrame(animate);
        }
        
        // Start animation loop
        animate();
    </script>
</body>
</html>
