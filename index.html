<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Emoji Clock</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background 1s ease-in-out;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        /* Glassmorphism Clock Container */
        .clock {
            position: relative;
            width: 350px;
            height: 350px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), 
                        inset 0 0 20px rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Digital Display in the Center */
        .digital-display {
            position: absolute;
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            color: white;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 
                         0 0 20px rgba(0, 212, 255, 0.8);
            z-index: 10;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px 20px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Clock Hands Setup */
        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom center;
            border-radius: 10px;
            z-index: 5;
        }

        .hour-hand {
            width: 6px;
            height: 90px;
            background: linear-gradient(to top, transparent, #ff007f);
        }

        .minute-hand {
            width: 4px;
            height: 120px;
            background: linear-gradient(to top, transparent, #00d4ff);
        }

        .second-hand {
            width: 2px;
            height: 140px;
            background: linear-gradient(to top, transparent, #00ffaa);
        }

        /* Emoji Containers */
        .emoji-container {
            position: absolute;
            top: -25px; /* Pushes the emoji to the tip of the hand */
            left: 50%;
            font-size: 30px;
            /* Drop shadow to make emojis pop */
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5)); 
        }

        .center-dot {
            position: absolute;
            width: 15px;
            height: 15px;
            background: white;
            border-radius: 50%;
            z-index: 20;
            box-shadow: 0 0 10px rgba(255,255,255,0.8);
        }

        /* Decorative Markers around the edge */
        .marker {
            position: absolute;
            width: 100%;
            height: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            font-weight: bold;
            font-size: 1.2rem;
            padding-top: 10px;
        }
    </style>
</head>
<body>

    <div class="clock">
        <!-- 12, 3, 6, 9 Markers -->
        <div class="marker" style="transform: rotate(0deg);">12</div>
        <div class="marker" style="transform: rotate(90deg);">3</div>
        <div class="marker" style="transform: rotate(180deg);">6</div>
        <div class="marker" style="transform: rotate(270deg);">9</div>

        <!-- Digital Clock Core -->
        <div class="digital-display" id="digital-time">00:00:00</div>
        <div class="center-dot"></div>

        <!-- Hands -->
        <div class="hand hour-hand" id="hour-hand">
            <div class="emoji-container" id="hour-emoji"></div>
        </div>
        <div class="hand minute-hand" id="minute-hand">
            <div class="emoji-container" id="minute-emoji">🚀</div>
        </div>
        <div class="hand second-hand" id="second-hand">
            <div class="emoji-container" id="second-emoji">✨</div>
        </div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();

            // Calculate rotation degrees for each hand
            const secDeg = (seconds / 60) * 360;
            const minDeg = (minutes / 60) * 360 + (seconds / 60) * 6;
            const hourDeg = ((hours % 12) / 12) * 360 + (minutes / 60) * 30;

            // Apply rotations to hands
            document.getElementById('second-hand').style.transform = `translateX(-50%) rotate(${secDeg}deg)`;
            document.getElementById('minute-hand').style.transform = `translateX(-50%) rotate(${minDeg}deg)`;
            document.getElementById('hour-hand').style.transform = `translateX(-50%) rotate(${hourDeg}deg)`;

            // Counter-rotate the emojis so they always stay upright
            document.getElementById('second-emoji').style.transform = `translateX(-50%) rotate(${-secDeg}deg)`;
            document.getElementById('minute-emoji').style.transform = `translateX(-50%) rotate(${-minDeg}deg)`;
            document.getElementById('hour-emoji').style.transform = `translateX(-50%) rotate(${-hourDeg}deg)`;

            // Format Digital Display (Pad single digits with leading zero)
            const digitalHrs = String(hours).padStart(2, '0');
            const digitalMin = String(minutes).padStart(2, '0');
            const digitalSec = String(seconds).padStart(2, '0');
            document.getElementById('digital-time').innerText = `${digitalHrs}:${digitalMin}:${digitalSec}`;

            // Determine Hour Emoji and Background Theme based on time of day
            let currentEmoji = '🕛';
            let bgStyle = '';

            if (hours >= 5 && hours < 9) {
                currentEmoji = '☕'; // Morning Coffee
                bgStyle = 'linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%)'; // Dawn
            } else if (hours >= 9 && hours < 13) {
                currentEmoji = '💻'; // Working/Focus
                bgStyle = 'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)'; // Mid Day
            } else if (hours >= 13 && hours < 15) {
                currentEmoji = '🍔'; // Lunch
                bgStyle = 'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)'; // Mid Day
            } else if (hours >= 15 && hours < 18) {
                currentEmoji = '⚡'; // Afternoon Energy
                bgStyle = 'linear-gradient(135deg, #fa709a 0%, #fee140 100%)'; // Late Afternoon
            } else if (hours >= 18 && hours < 22) {
                currentEmoji = '🎮'; // Evening Relaxation
                bgStyle = 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)'; // Dusk
            } else {
                currentEmoji = '😴'; // Late Night
                bgStyle = 'linear-gradient(135deg, #141e30 0%, #243b55 100%)'; // Night
            }

            document.getElementById('hour-emoji').innerText = currentEmoji;
            document.body.style.background = bgStyle;
        }

        // Initialize clock immediately, then update every 1 second
        updateClock();
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
